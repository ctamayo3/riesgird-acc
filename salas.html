<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Salas — Foro RiesGIRD-ACC LAC 2026</title>
  <meta name="theme-color" content="#1B3A53" />
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="salas">
  <div class="page-topo-bg" aria-hidden="true"></div>
  <div class="app-shell">
    <header class="app-header">
      <div class="header-card">
        <div class="header-top header-top--center">
          <a class="header-back-btn" href="index.html" aria-label="Volver a Inicio">
            <span class="header-back-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg></span>
          </a>
          <a class="header-logo-center" href="index.html">
            <img class="header-brand-logo" src="assets/logo-color.png" alt="Foro RiesGIRD-ACC LAC" />
          </a>
          <span class="header-top-spacer" aria-hidden="true"></span>
        </div>
      </div>
    </header>

    <main>
      <h1 class="page-title">Salas</h1>

      <div class="campus-map" id="campus-map">
        <img src="assets/mapa-campus.png" alt="Plano del campus — Convention & Sport Center y Edificio A" />

        <div class="campus-legend">
          <div class="campus-legend-item"><span class="campus-legend-pin campus-legend-pin--convention"></span> Convention &amp; Sport Center</div>
          <div class="campus-legend-item"><span class="campus-legend-pin campus-legend-pin--edificio-a"></span> Edificio A</div>
        </div>

        <span class="campus-compass" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/><path d="M12 7l2.5 5-2.5 5-2.5-5z" fill="currentColor" stroke="none"/></svg>
          N
        </span>

        <button class="campus-hotspot campus-hotspot--convention" data-sala="aud-principal" aria-label="Ver Convention & Sport Center">
          <span class="campus-pin campus-pin--convention"></span>
        </button>
        <button class="campus-hotspot campus-hotspot--edificio-a" data-sala="por-confirmar" aria-label="Ver Edificio A">
          <span class="campus-pin campus-pin--edificio-a"></span>
        </button>
      </div>

      <div id="salas-mount"></div>
    </main>
  </div>

  <div id="tab-bar-mount"></div>

  <script src="js/mock-data.js"></script>
  <script src="js/now-next.js"></script>
  <script src="js/salas.js"></script>
  <script src="js/nav.js"></script>
</body>
</html>
